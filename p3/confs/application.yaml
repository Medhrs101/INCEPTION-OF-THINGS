apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wil-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Medhrs101/IOT.git # YOUR REPO HERE
    targetRevision: HEAD
    path: ./app # Path within the repo where your app manifests live
  destination:
    server: https://kubernetes.default.svc
    namespace: dev # The namespace for your application
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true